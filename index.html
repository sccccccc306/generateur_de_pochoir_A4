<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur de Pochoirs 3D (A4 / K1C)</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1e24; color: #f0f0f5; max-width: 900px; margin: 20px auto; padding: 0 20px; }
  h1 { font-size: 1.4rem; margin-bottom: 5px; }
  .subtitle { color: #a0a0b0; font-size: 0.9rem; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel { background: #2b2b36; padding: 15px; border-radius: 8px; }
  label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #ccc; }
  input[type="text"], select, input[type="number"] {
    width: 100%; padding: 8px; margin-bottom: 12px; border-radius: 4px;
    border: 1px solid #444; background: #18181f; color: #fff; box-sizing: border-box;
  }
  .line-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .line-row input { margin-bottom: 0; }
  button {
    background: #00b894; color: #000; border: none; padding: 8px 12px;
    border-radius: 4px; font-weight: bold; cursor: pointer; white-space: nowrap;
  }
  button:disabled { background: #555; color: #888; cursor: not-allowed; }
  .info-scale { color: #fdcb6e; font-size: 0.8rem; margin-bottom: 10px; display: none; }
  #preview-container { background: #fff; width: 210px; height: 297px; margin: 0 auto; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5); overflow: hidden; }
  svg { width: 100%; height: 100%; }
  .specs { font-size: 0.8rem; color: #aaa; margin-top: 12px; line-height: 1.4; }
</style>
</head>
<body>

<h1>Générateur de Pochoirs 3D (Format A4)</h1>
<div class="subtitle">1 objet STL par ligne • Ajustement auto A4 • Épaisseur PLA K1C : 0.6 mm</div>

<div class="grid">
  <div class="panel">
    <label>Police Stencil (ponts intégrés pour les lettres fermées)</label>
    <select id="fontSelect">
      <option value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/allertastencil/AllertaStencil-Regular.ttf">Allerta Stencil (Lisible & Moderne)</option>
      <option value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/blackopsone/BlackOpsOne-Regular.ttf">Black Ops One (Épais / Industriel)</option>
    </select>

    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label>Hauteur cible plus petite lettre (mm)</label>
        <input type="number" id="minHeight" value="20" min="5" max="80">
      </div>
      <div style="flex:1;">
        <label>Épaisseur plaque (mm)</label>
        <input type="number" id="thickness" value="0.6" step="0.2" min="0.4" max="2.0">
      </div>
    </div>

    <label>
      <input type="checkbox" id="fixedWidth" checked> Largeur de plaque fixe (210 mm = pleine largeur A4)
    </label>
    <br>

    <label>Lignes de texte (1 fichier STL par ligne)</label>
    <div id="linesContainer"></div>
    <button id="addLineBtn" style="background:#0984e3; color:#fff; width:100%; margin-top:5px;">+ Ajouter une ligne</button>

    <div class="specs">
      <strong>Réglages Cura (K1C buse 0.4 mm) :</strong><br>
      • Hauteur de couche : 0.20 mm (3 couches pleines)<br>
      • Bordure / Brim : Aucune
    </div>
  </div>

  <div class="panel" style="text-align:center;">
    <label style="margin-bottom:10px;">Aperçu réel sur feuille A4 (210 × 297 mm)</label>
    <div id="preview-container">
      <svg id="a4Preview" viewBox="0 0 210 297"></svg>
    </div>
  </div>
</div>

<script>
const A4_W = 210;
const A4_H = 297;
const MARGIN = 10; // Marge de sécurité peinture sur les bords (mm)
let currentFont = null;
let lines = ["ATTENTION", "FRAGILE", ""];

const linesContainer = document.getElementById('linesContainer');
const svgPreview = document.getElementById('a4Preview');

async function loadFont(url) {
  currentFont = await opentype.load(url);
  updateAll();
}

document.getElementById('fontSelect').addEventListener('change', (e) => loadFont(e.target.value));
document.getElementById('minHeight').addEventListener('input', updateAll);
document.getElementById('thickness').addEventListener('input', updateAll);
document.getElementById('fixedWidth').addEventListener('change', updateAll);

document.getElementById('addLineBtn').addEventListener('click', () => {
  if (lines.length < 6) {
    lines.push("");
    renderInputs();
    updateAll();
  }
});

function renderInputs() {
  linesContainer.innerHTML = '';
  lines.forEach((txt, idx) => {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = `
      <div class="line-row">
        <input type="text" value="${txt}" placeholder="Ligne ${idx + 1}..." data-idx="${idx}">
        <button id="btn-${idx}" onclick="exportSTL(${idx})">STL Ligne ${idx + 1}</button>
      </div>
      <div class="info-scale" id="info-${idx}"></div>
    `;
    wrapper.querySelector('input').addEventListener('input', (e) => {
      lines[idx] = e.target.value;
      updateAll();
    });
    linesContainer.appendChild(wrapper);
  });
}

// Calcul géométrique avec réduction automatique si le texte dépasse la largeur A4
function computeLineGeometry(text, targetMinHeight, fixedPlateWidth) {
  if (!currentFont || !text.trim()) return null;

  const testSize = 100;
  let minGlyphH = Infinity;

  for (const char of text) {
    if (char === ' ') continue;
    const glyph = currentFont.charToGlyph(char);
    const bbox = glyph.getBoundingBox();
    const h = (bbox.y2 - bbox.y1) * (testSize / currentFont.unitsPerEm);
    if (h > 0 && h < minGlyphH) minGlyphH = h;
  }
  if (minGlyphH === Infinity) return null;

  // 1. Taille initiale pour que la plus petite lettre = targetMinHeight
  let fontSize = testSize * (targetMinHeight / minGlyphH);
  let path = currentFont.getPath(text, 0, 0, fontSize);
  let box = path.getBoundingBox();

  let textW = box.x2 - box.x1;
  const maxAllowedTextW = A4_W - (MARGIN * 2); // 190 mm utiles
  let wasScaledDown = false;
  let actualMinHeight = targetMinHeight;

  // 2. Si le texte dépasse 190 mm, on réduit proportionnellement la police
  if (textW > maxAllowedTextW) {
    const ratio = maxAllowedTextW / textW;
    fontSize *= ratio;
    actualMinHeight = targetMinHeight * ratio;
    wasScaledDown = true;

    path = currentFont.getPath(text, 0, 0, fontSize);
    box = path.getBoundingBox();
    textW = box.x2 - box.x1;
  }

  const textH = box.y2 - box.y1;
  const plateW = fixedPlateWidth ? A4_W : Math.min(A4_W, textW + MARGIN * 2);
  const plateH = textH + MARGIN * 2;

  return { path, box, textW, textH, plateW, plateH, wasScaledDown, actualMinHeight };
}

function updateAll() {
  const minH = Math.max(5, parseFloat(document.getElementById('minHeight').value) || 20);
  const fixedW = document.getElementById('fixedWidth').checked;
  svgPreview.innerHTML = '';
  let currentY = 10;

  lines.forEach((txt, idx) => {
    const btn = document.getElementById(`btn-${idx}`);
    const info = document.getElementById(`info-${idx}`);
    const geom = computeLineGeometry(txt, minH, fixedW);

    if (!geom) {
      btn.disabled = true;
      info.style.display = 'none';
      return;
    }

    btn.disabled = false;

    if (geom.wasScaledDown) {
      info.style.display = 'block';
      info.textContent = `Ajusté auto au format A4 (plus petite lettre : ${geom.actualMinHeight.toFixed(1)} mm)`;
    } else {
      info.style.display = 'none';
    }

    // Dessin SVG sur l'aperçu A4
    const plateX = (A4_W - geom.plateW) / 2;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", plateX);
    rect.setAttribute("y", currentY);
    rect.setAttribute("width", geom.plateW);
    rect.setAttribute("height", geom.plateH);
    rect.setAttribute("fill", "#2d3436");
    g.appendChild(rect);

    const offsetX = plateX + (geom.plateW - geom.textW) / 2 - geom.box.x1;
    const offsetY = currentY + (geom.plateH - geom.textH) / 2 - geom.box.y1;

    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", geom.path.toPathData(2));
    p.setAttribute("transform", `translate(${offsetX}, ${offsetY})`);
    p.setAttribute("fill", "#ffffff");
    g.appendChild(p);

    svgPreview.appendChild(g);
    currentY += geom.plateH + 6;
  });
}

function exportSTL(idx) {
  const minH = Math.max(5, parseFloat(document.getElementById('minHeight').value) || 20);
  const thick = parseFloat(document.getElementById('thickness').value) || 0.6;
  const fixedW = document.getElementById('fixedWidth').checked;
  const geom = computeLineGeometry(lines[idx], minH, fixedW);
  if (!geom) return;

  const scale = 10; 
  const w = Math.round(geom.plateW * scale);
  const h = Math.round(geom.plateH * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.scale(scale, scale);
  const offsetX = (geom.plateW - geom.textW) / 2 - geom.box.x1;
  const offsetY = (geom.plateH - geom.textH) / 2 - geom.box.y1;
  ctx.translate(offsetX, offsetY);
  geom.path.fill = '#fff';
  geom.path.draw(ctx);
  ctx.restore();

  const imgData = ctx.getImageData(0, 0, w, h).data;
  const isSolid = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return false;
    return imgData[(y * w + x) * 4] < 128;
  };

  const triangles = [];
  const addQuad = (p1, p2, p3, p4) => {
    triangles.push([p1, p2, p3], [p1, p3, p4]);
  };

  const step = 1 / scale;
  for (let y = 0; y < h; y++) {
    let runStart = -1;
    for (let x = 0; x <= w; x++) {
      const solid = (x < w) && isSolid(x, y);
      if (solid && runStart === -1) {
        runStart = x;
      } else if (!solid && runStart !== -1) {
        const x0 = runStart * step, x1 = x * step;
        const y0 = (h - y) * step, y1 = (h - (y + 1)) * step;
        addQuad([x0, y1, thick], [x1, y1, thick], [x1, y0, thick], [x0, y0, thick]);
        addQuad([x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0]);
        addQuad([x0, y0, 0], [x0, y1, 0], [x0, y1, thick], [x0, y0, thick]);
        addQuad([x1, y1, 0], [x1, y0, 0], [x1, y0, thick], [x1, y1, thick]);
        runStart = -1;
      }
      if (x < w) {
        const cur = isSolid(x, y);
        const top = isSolid(x, y - 1);
        const bot = isSolid(x, y + 1);
        const x0 = x * step, x1 = (x + 1) * step;
        const y0 = (h - y) * step, y1 = (h - (y + 1)) * step;
        if (cur && !top) addQuad([x1, y0, 0], [x0, y0, 0], [x0, y0, thick], [x1, y0, thick]);
        if (cur && !bot) addQuad([x0, y1, 0], [x1, y1, 0], [x1, y1, thick], [x0, y1, thick]);
      }
    }
  }

  const buffer = new ArrayBuffer(84 + triangles.length * 50);
  const view = new DataView(buffer);
  view.setUint32(80, triangles.length, true);
  let offset = 84;
  for (const tri of triangles) {
    offset += 12;
    for (const v of tri) {
      view.setFloat32(offset, v[0], true);
      view.setFloat32(offset + 4, v[1], true);
      view.setFloat32(offset + 8, v[2], true);
      offset += 12;
    }
    offset += 2;
  }

  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const cleanName = lines[idx].trim().replace(/[^a-z0-9]/gi, '_').toLowerCase() || `ligne_${idx+1}`;
  a.download = `pochoir_${idx+1}_${cleanName}.stl`;
  a.click();
}

renderInputs();
loadFont(document.getElementById('fontSelect').value);
</script>
</body>
</html>
